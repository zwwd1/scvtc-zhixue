name: Publish original-signature APK
on:
  push:
    branches: [main]
    paths: ["releases/release.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify plugin platform consistency
        if: github.event.repository.name == 'scvtc-zhixue'
        run: python3 scripts/check_plugin_platform.py
      - name: Verify and publish the original signed local APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_signed_release.py
